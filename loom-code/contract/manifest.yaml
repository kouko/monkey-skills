# loom contract package — machine-readable declaration (concept-model §1, §2, §3, §11).
# Consumers: loom-design and loom-workflow read this file; only loom-code writes it.
# Recomputed by check_mechanisms.py: every station / tool / action / artifact
# field below is a mechanism and must be listed in docs/loom/evidence/mechanisms.yaml.
version: 2.0.0

# Paths matched here are publication metadata. They do not change the
# functional content identity that executions and reviews attest to.
publication_only_paths:
  - docs/loom/<change-id>/attestation.json

stations:            # produce one per-change artifact each (§3)
  - {name: capture-intent, owner: loom-design, produces: intent,  decision_point: 1}
  - {name: write-spec,     owner: loom-design, produces: spec,    decision_point: 2}   # product only
  - {name: write-plan,     owner: loom-code,   produces: plan,    decision_point: 1}   # code-only path runs ① itself
  - {name: build,          owner: loom-code,   produces: diff}
  - {name: review,         owner: loom-code,   produces: attestation}
  - {name: ship,           owner: loom-code,   produces: diff,    decision_point: 3}   # acceptance = blind-run report
  - {name: maintain,       owner: loom-code,   produces: intent}

tools:               # user-invoked, or raised by a station on a mechanical condition; standalone ones are not counted
  - {name: product-principles,  owner: loom-design,   produces: PRINCIPLES.md}
  - {name: design-system,       owner: loom-design,   produces: DESIGN.md}
  - {name: decision-map,        owner: loom-workflow}
  - {name: handoff,             owner: loom-workflow}
  - {name: recap-state,         owner: loom-workflow}
  - {name: cot-explain,         owner: loom-workflow}
  - {name: distill-sessions,    owner: loom-workflow}
  - {name: git-memory,          owner: loom-workflow}
  - {name: independent-advisor, owner: loom-workflow}
  - {name: critique,            owner: loom-workflow}   # mode: proposal | complexity
  # standalone: outside the loom flow; not counted toward the skill budget (user-decided 2026-09-02)
  - {name: goal-create,         owner: loom-workflow, standalone: true}
  - {name: dbt-model-style,     owner: loom-workflow, standalone: true}

actions:             # executable steps inside a station; not skills (§3)
  - name: restate-and-confirm
    owner: write-plan          # also executed by capture-intent when loom-design is installed
    summary: "decision point ① — restate Problem/Acceptance in plain words; merge one-way doors, the once-per-change second-vendor suggestion and a missing-PRINCIPLES interview into the same dialogue; write `status: confirmed <date>`."
  - name: one-way-door
    owner: write-plan
    summary: "classes (a)–(e) — (e) irreversible actions on existing user data, asked even without a fork — and four gates (check / measure / threshold 20% / merge); asked in consequence form inside decision point ① or ②; answers marked user-decided in spec Design decision."
  - name: minimal-spec
    owner: write-plan
    summary: "code-only install with needs-design yes — derive Requirements from Acceptance and UI flows from intent using templates/spec-minimal.md; same spec review gate."
  - name: principles-interview
    owner: write-plan
    summary: "code-only install, kind product, no ratified PRINCIPLES.md — run templates/PRINCIPLES-interview.md inside decision point ①; user confirms, agent writes ratified-by."
  - name: package-tests
    owner: review
    summary: "run the package-level test command once during finalize-review; the generated attestation binds its result to functional content."
  - name: parallel-dispatch
    owner: build
    summary: "independent tasks may run in parallel when their file sets do not overlap; no dispatch ledger is required."
  - name: worktree
    owner: build
    summary: "parallel implementers may use isolated git worktrees; the branch integrates before closing review."
  - name: read
    owner: review
    summary: "≥2 fresh-context reviewers apply the lens for the artifact type (code 11 dims / docs 5 dims / spec- design- principles-conformance)."
  - name: blind-run
    owner: review
    summary: "an agent that never touched the change builds/runs it in a clean environment and writes the blind-run report against every Acceptance line (plus UI flows for product)."
  - name: adversarial
    owner: review
    summary: "mutation / fuzz / abuse cases for code, red-team for spec, and gate attacks for skills; execution results land in the generated attestation."
  - name: checkpoint
    owner: review
    summary: "one closing review after Build; fixes return to Build, and finalize-review generates a fresh content-bound attestation only after reviewers and checks pass."
  - name: alert-to-intent
    owner: maintain
    summary: "an alert or incident becomes evidence on the matching open intent or a new intent with originator maintenance-loop; every incident becomes an eval in mechanisms.yaml."

# charter: the single copy of "what this artifact answers, who reads it,
# what must/must-not live in it, who signs it off, what edits it after" —
# stations, templates and agent contracts cite it by path (loom-code
# contract charter <name>), they do not restate it (W0-01).
artifacts:           # per-change AND standing artifact charters (§2a); fields are frontmatter keys or H2 sections
  intent:
    path: docs/loom/intent/<change-id>.md
    template: intent.md
    charter:
      answers: "why this change exists and how the user will know it is done"
      readers: ["user at decision point 1", "every later station"]
      must:
        - "Problem in the user's words"
        - "Proposed outcome"
        - "Acceptance lines each provable by a blind run"
        - "Constraints"
        - "Out of scope"
        - "Open questions"
      must_not:
        - {kind: "requirement-level behaviour", goes_to: spec}
        - {kind: "task split or file lists",     goes_to: plan}
        - {kind: "design rationale",             goes_to: spec}
        - {kind: "verification history",         goes_to: attestation}
      signoff: capture-intent
      edits_after:
        - {id: delivery-derived-from-default, text: "delivery is derived from canonical evidence on the selected remote-default snapshot; the intent remains confirmed"}
        - {id: maintain-appends-evidence,   text: "maintain appends an evidence path"}
        - {id: other-change-starts-new-intent, text: "any other change starts a new intent"}
    fields:
      - {name: originator,   kind: frontmatter, required: true}
      - {name: kind,         kind: frontmatter, required: true, values: [product, engineering]}
      - {name: needs-design, kind: frontmatter, required: true, grammar: "yes | no — <reason>"}
      - {name: map,          kind: frontmatter, required: false}
      - {name: evidence,     kind: frontmatter, required: false}
      - {name: status,       kind: frontmatter, required: false, grammar: "open | confirmed <date> | closed <date> — PR #<N> | withdrawn — <reason>"}
      - {name: publication,  kind: frontmatter, required: false, grammar: "automatic — authorized <YYYY-MM-DD> by <name>", note: "written only from the user's explicit decision; absent means Ship obtains one manual publication decision"}
      - {name: lane,         kind: frontmatter, required: false, values: [express, gate-only, full], grammar: "<name> — declared <YYYY-MM-DD> by <name> | <name> — switched <YYYY-MM-DD> by <name>, from <wave <n>|round <n>>", note: "user-declared only (checker cannot verify the author is not an agent; station text and the user-judgment-leak lens carry that prohibition); a bare name with no suffix is not a legal value -- declaring, like switching, carries dated `by <name>` attribution (wave-end:1); every declaration (express, gate-only, or a switch back to full) additionally requires the commit that last changed this line to state it verbatim in its own message, else the declaration is ignored and the lane is the raw recompute (wave-end:1-r3); a recomputed full lane always wins regardless of this field (W1-02)"}
      - {name: Problem,           kind: section, required: true}
      - {name: Proposed outcome,  kind: section, required: true}
      - {name: Acceptance,        kind: section, required: true}
      - {name: Constraints,       kind: section, required: true}
      - {name: Value case,        kind: section, required: false}
      - {name: Out of scope,      kind: section, required: true}
      - {name: Open questions,    kind: section, required: true}
  spec:
    path: docs/loom/<change-id>/spec.md
    template: spec-minimal.md
    charter:
      # also written by write-plan for an engineering change (needs-design:
      # no) when a task's rationale exceeds its Risk line; no decision
      # point 2 in that case.
      answers: "what the system must visibly do, and the design decisions an engineering change's tasks rely on"
      readers: ["user at decision point 2 (product)", "reviewers", "implementers"]
      must:
        - "REQ lines one per Acceptance"
        - "Design decision marked user- or agent-decided"
        - "Alternatives considered"
        - "Current state evidence"
        - "UI flows"
      must_not:
        - {kind: "the intent restated", goes_to: intent}
        - {kind: "task ordering",       goes_to: plan}
        - {kind: "review findings",     goes_to: attestation}
      signoff: write-spec
      edits_after:
        - {id: changed-req-reruns-decision-point-2, text: "a changed REQ re-runs decision point 2 and recomputes confirmed-behavior"}
        - {id: spec-sha-replaced-in-later-verdicts,  text: "the spec sha in every later verdict names the new text"}
    fields:
      - {name: intent,             kind: frontmatter, required: true, grammar: "<change-id>@<sha>"}
      - {name: confirmed-behavior, kind: frontmatter, required: false, grammar: "<date> @<spec-blob-sha7>", note: "required when kind: product; the sha is `git hash-object` over the spec WITHOUT this line, i.e. the file as the user saw it, so a spec rewritten after decision point 2 no longer matches"}
      - {name: pre-build-review,   kind: frontmatter, required: false, grammar: "required|not-required — <reason>", note: "required on new specs; missing on a legacy spec means required and retains its existing review floor"}
      - {name: Requirements,           kind: section, required: true, grammar: "REQ-<n> — <name> … → Acceptance #<n>"}
      - {name: Design decision,        kind: section, required: true}
      - {name: Alternatives considered, kind: section, required: true}
      - {name: Current state evidence, kind: section, required: true}
      - {name: UI flows,               kind: section, required: true, note: "N/A only when the diff touches no declared interface surface; spec.ui-flows-recompute recomputes that"}
  plan:
    path: docs/loom/<change-id>/plan.md
    template: plan.md
    charter:
      answers: "how the work is split, ordered and dispatched"
      readers: ["build orchestrator", "implementer (one task each)", "reviewers"]
      must:
        - "Current State Evidence as path plus anchor when no spec exists"
        - "Task DAG with acceptance ownership plus Files, paired Test and Risk one line each"
        - "Questions asked verbatim"
        - "plan-wide Risks"
      must_not:
        - {kind: "behaviour or REQ restatement", goes_to: spec}
        - {kind: "scenario lists inside Test",    goes_to: spec}
        - {kind: "design rationale",              goes_to: spec}
        - {kind: "verification diary",             goes_to: attestation}
        - {kind: "verification identity",          goes_to: attestation}
      signoff: write-plan
      edits_after:
        - {id: plan-maintained, text: "the agent keeps task state or scope current when implementation changes"}
    fields:
      - {name: intent, kind: frontmatter, required: true}
      - {name: spec,   kind: frontmatter, required: false}
      - {name: Task DAG, kind: section, required: true, grammar: "**<id> <title>** after: <ids> acceptance: <numbers>; Test: A<n> positive: <id>; negative|boundary: <id>"}
      - {name: Risks,    kind: section, required: true}
      - {name: Current State Evidence, kind: section, required: false, note: "required when needs-design: no"}
  attestation:
    path: docs/loom/<change-id>/attestation.json
    template: attestation.json
    charter:
      answers: "which functional content was checked, by whom, and with what result"
      readers: ["ship", "the publication gate"]
      must:
        - "schema"
        - "change_id"
        - "content_digest"
        - "executions"
        - "verdicts"
        - "findings"
      must_not:
        - {kind: "design reasoning", goes_to: spec}
      signoff: review
      edits_after:
        - {id: regenerate-after-functional-change, text: "the checker replaces the whole attestation after functional content changes and verification passes again"}
    fields:
      - {name: schema,         kind: json, required: true}
      - {name: change_id,      kind: json, required: true}
      - {name: content_digest, kind: json, required: true}
      - {name: executions,     kind: json, required: true, grammar: "[{kind, command, artifact, result, command_digest}]"}
      - {name: verdicts,       kind: json, required: true, grammar: "[{reviewer, vendor, model, lens, verdict, findings}]"}
      - {name: findings,       kind: json, required: true, grammar: "[{id, anchor, raised_by, resolution} | {severity, dimension, anchor, text}]"}

  blind-run-report:
    path: docs/loom/<change-id>/blind-run-report.md
    template: null
    fields: []
    charter:
      answers: "whether each Acceptance line worked, in the user's words"
      readers: ["user at decision point 3"]
      must:
        - "one line per Acceptance"
        - "Review summary"
        - "Questions I asked you"
        - "What this did to existing data"
        - "I decided for you"
      must_not:
        - {kind: "design rationale", goes_to: spec}
        - {kind: "internal ids",     goes_to: attestation}
      signoff: ship
      edits_after:
        - {id: regenerated-after-functional-change, text: "functional content changed after finalization"}
  kickoff-defaults:
    path: docs/loom/KICKOFF-DEFAULTS.md
    template: KICKOFF-DEFAULTS.md
    fields: []
    charter:
      answers: "what this repository decided once for every change"
      readers: ["checker", "every station"]
      must:
        - "one line per key with value, reason and date"
      must_not:
        - {kind: "per-change decisions", goes_to: plan}
      signoff: capture-intent
      edits_after:
        - {id: kickoff-line-replaced-with-value-reason-date, text: "a line is replaced with a new value, reason and date"}
        - {id: kickoff-key-removed-with-dated-reason,        text: "a key is removed only with a dated reason line"}
standing_docs:       # not per-change (§2a, §8)
  - {name: PRINCIPLES.md,       tool: product-principles, ratified_by: required, reject_when: "kind: product and missing"}
  - {name: DESIGN.md,           tool: design-system,      ratified_by: required, reject_when: never}
  - {name: KICKOFF-DEFAULTS.md, tool: null,               path: docs/loom/KICKOFF-DEFAULTS.md}
    # its charter (what it answers, must/must-not, sign-off, edits-after)
    # lives at artifacts.kickoff-defaults.charter, not duplicated here --
    # one shape for the checker to read (wave-end:0-05).

kickoff_defaults:    # grammar: `- <key>: <value> — <reason> (<date>)`
  - {name: second-vendor,          grammar: "<cli> | ask | suggest", note: "`ask` blocks once per full-lane change; `suggest` reports availability without waiting and permits opt-in only before full-lane Review"}
  - {name: docs-lint,              grammar: "<command> | none", note: "declared, not a blocker (W0-02): a declared command runs in CI for its report only; reviewer contract reads it to decide whether style findings are allowed at all"}
  - {name: package-tests,          grammar: "<command> | none", note: "the command finalize-review executes once and push.attestation validates by identity; absent = recomputed from build markers"}
  - {name: standing-docs,          grammar: "waived"}
  - {name: session-start-baseline, grammar: "<sha> <words>"}
  - {name: interface-surfaces,     grammar: "<glob>[, <glob>…]", default: "**/cli/**, **/api/**, **/commands/**, **/*.tsx, **/templates/**"}
  - {name: artifact-types,         grammar: "<glob>=<type>[, …]", note: "reserved — declared, not read by the checker yet; the lane and the adversarial floor use the §6 mapping below"}
  - {name: default-lane,           grammar: "full | express | gate-only", note: "the lane an intent gets when it declares no `lane:` line of its own (`declared_lane`'s origin: kickoff); a recomputed full lane always wins regardless (W1-02)"}

artifact_types:      # §6 type mapping; KICKOFF-DEFAULTS artifact-types is reserved — declared, not read by the checker yet
  - {glob: "docs/loom/intent/**",        type: intent}
  - {glob: "docs/loom/*/spec.md",        type: spec}
  - {glob: "docs/loom/*/plan.md",        type: plan}
  - {glob: "PRINCIPLES.md",              type: standing}
  - {glob: "DESIGN.md",                  type: standing}
  - {glob: "docs/loom/KICKOFF-DEFAULTS.md", type: standing}
  - {glob: "**/evidence/**",             type: evidence}
  - {glob: "**/SKILL.md",                type: skill}
  - {glob: "**/agents/*.md",             type: skill}
  - {glob: "**/hooks/**",                type: gate}
  - {glob: "**/scripts/check_*",         type: gate}
  - {glob: "docs/loom/maps/**",          type: map}
  - {glob: "**/*.md",                    type: docs}
  - {glob: "**",                         type: code}
