# Mechanism population — repo-level standing evidence (concept-model §11, spec REQ-7).
# Owner: loom-code (W0-06). Recomputed by loom-code/scripts/check_mechanisms.py.
#
# Every mechanism the loom family carries must be listed here with a
# non-empty `eval:` pointer, so that "does this still earn its regression
# eval" is a machine question, not a claim. Admission rule (concept-model
# §11): a new mechanism needs (1) a regression eval, (2) a net count that
# does not rise without a `budget-exception: <mechanism-id> — <reason>`
# line in the same-version CHANGELOG entry.
version: 1.0.0

counting: >
  Five classes are recomputed from repo state and diffed against this
  file. skill = one entry per `*/skills/*/SKILL.md` under loom-code,
  loom-design and loom-workflow, keyed by its directory name, minus any
  name the loom-code contract manifest (loom-code/contract/manifest.yaml)
  marks `standalone: true` — a standalone tool has a SKILL.md but sits
  outside the loom flow and is not part of the skill budget. checker-rule
  = every rule id `loom_checker.py --list-rules` prints (the checker is
  the single source for its own rule population). hook = one entry per
  PreToolUse / PostToolUse / SessionStart hook declared in
  loom-code/hooks/hooks.json, id'd as `<event>:<matcher>:<command
  basename>`. contract = every station, non-standalone tool, action and
  artifact field declared in loom-code/contract/manifest.yaml, id'd as
  `station:<name>` / `tool:<name>` / `action:<name>` /
  `artifact:<name>.<field>` respectively — an artifact schema recomputes
  one id per declared field (frontmatter key, H2 section, or JSON key), not
  one id for the whole artifact, so a field can go missing from a template
  without the artifact-level id silently covering for it. This is a
  separate recomputable surface from the skill class above because it
  reads the manifest's own declaration, not the skills/ directory listing.
  prose-gate = every `<!-- gate: <id> -->`
  marker found in `*/skills/**/*.md`, `*/agents/*.md` or
  `*/references/*.md` under the three plugins (an unmarked paragraph is
  not a gate and may not be used as one). A sixth class, host-hygiene, is
  declared but never recomputed and never counted toward the net total —
  it exists only so a mechanism that is real infrastructure but outside
  the loom flow (the language-anchor hook) is still listed rather than
  silently uncovered. Net count = number of listed mechanisms whose class
  is not host-hygiene.

