name: skill-structure

# Validates domain-team SKILL.md files against skill-team's CHK-SKL-*
# rules. PR-title convention validation lives in the small independent
# conventional-pr-title workflow so title edits do not rerun this suite.
#
# Runs on every push to main and on every pull request targeting main.
# Independent of any other CI; safe to add as the first workflow in
# the repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  structure:
    name: SKILL.md structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check-skill-structure.py against domain-teams
        run: python3 scripts/check-skill-structure.py domain-teams

      # One step per loom plugin, each running even when a sibling fails
      # (`!cancelled()`): a shared run block — or default step skipping —
      # stops at the first failure and masks the remaining plugins' results.
      - name: Run check-skill-structure.py against loom-code
        if: ${{ !cancelled() }}
        run: python3 scripts/check-skill-structure.py loom-code

      - name: Run check-skill-structure.py against loom-design
        if: ${{ !cancelled() }}
        run: python3 scripts/check-skill-structure.py loom-design

      - name: Run check-skill-structure.py against loom-workflow
        if: ${{ !cancelled() }}
        run: python3 scripts/check-skill-structure.py loom-workflow

      - name: Run check-skill-structure.py against loom-memory
        if: ${{ !cancelled() }}
        run: python3 scripts/check-skill-structure.py loom-memory

      - name: Run check-skill-structure.py against copywriting-toolkit
        if: ${{ !cancelled() }}
        run: python3 scripts/check-skill-structure.py copywriting-toolkit

  shared-conventions-drift:
    name: loom-workflow shared conventions drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check-shared-conventions-drift.py
        # Verifies that SSOT-and-functional-copy convention files
        # (golden-anchor-protocol, test-prompts-schema, constitution-schema)
        # stay in sync across skill-refactor (canonical SoT) and
        # skill-tuning (functional copies). Header blockquotes that
        # mark canonical-vs-copy are stripped before diff so legitimate
        # SSOT-vs-copy header divergence does not trigger false positives.
        # Same-PR drift rule from loom-workflow PR-2/PR-3 NOTICE.
        run: python3 scripts/check-shared-conventions-drift.py

  marketplace-description-sync:
    name: marketplace description sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check-marketplace-description-sync.py
        # Claude Desktop reads ONLY from marketplace.json for the plugin
        # discovery UI; Claude Code CLI follows source and also reads each
        # plugin.json. Both must carry identical descriptions. Same-PR
        # drift rule: when you change a description in plugin.json, mirror
        # the change to marketplace.json in the same commit.
        run: python3 scripts/check-marketplace-description-sync.py

  copywriting-anchor-lint:
    name: copywriting-toolkit anchor library lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python3 -m pip install --quiet pytest

      - name: Run copywriting-toolkit pytest suite
        # First pytest suite for this plugin (scripts/ only — kept as its
        # own invocation, not merged with scripts/ or loom-code/scripts/,
        # per the repo's existing per-plugin pytest job pattern, e.g.
        # investing-toolkit-pytest-offline below).
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest copywriting-toolkit/scripts/ -q

      - name: Lint voice anchor library (v1.13.3 canonical format)
        # Baseline file lists 3 known-failing anchors (2 dual-quadrant schema
        # ambiguity + 1 Examples count < 5) accepted as backlog. Failures outside
        # that list — e.g., a new anchor with drifted format, or an edit that
        # breaks an existing clean anchor — block the merge. See
        # copywriting-toolkit/docs/tests/lint-baseline-v1.13.3.md for details.
        run: |
          python3 copywriting-toolkit/scripts/lint-anchor-library.py \
            --baseline copywriting-toolkit/scripts/lint-baseline.txt

      - name: Check psychology-anchor copy sync (byte-identity)
        # Verifies the 5 copies of persuasion-psychology-anchor.md and the
        # 2 copies of sns-evolution-aisas-ulssas.md stay byte-identical to
        # their canonical (CLAUDE.md's Inline-Duplication Drift Risk note).
        run: python3 copywriting-toolkit/scripts/check_anchor_copies.py

  scraper-deps:
    name: Scraper dependency freshness (report-only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check scraper deps vs PyPI latest
        run: |
          python3 scripts/check-scraper-deps.py --format markdown \
            | tee "$GITHUB_STEP_SUMMARY"
        # Never fails the PR — surfaces drift in the job summary so
        # reviewers see a pinned-vs-latest table without blocking merges.

  investing-toolkit-pytest-offline:
    # Runs the investing-toolkit pytest suite excluding `@pytest.mark.network`
    # (live API) tests. Catches schema/dispatcher/parser/normalizer regressions
    # on every PR without burning API quota or risking flaky cloud-IP blocks
    # at TW gov / BOJ / yfinance endpoints.
    #
    # ~324 passed, 27 internally-skipped, 34 network deselected. ~20s wall clock.
    # Network tests live for a future scheduled workflow (see ROADMAP §v2.1.x-h).
    name: investing-toolkit pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Cache disabled: no uv.lock in repo (PEP 723 inline metadata
          # in each script, not a project-level lock). Tests run in
          # ~20s + uv install ~3s — caching saves negligible time and
          # the default `**/uv.lock` glob errors hard when no match.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Run pytest (offline only)
        run: |
          uv run --quiet --with pytest --with 'pyyaml>=6.0' \
            pytest investing-toolkit/tests/ \
              -m "not network" \
              -q --tb=short

  plugin-version-bump:
    name: plugin version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check skill-content PRs bump their plugin version
        # The marketplace publishes plugins BY VERSION: skill content changed
        # without a plugin.json version bump means `plugin update` is a silent
        # no-op and users keep running the stale skill (missed at PR#539, #545,
        # #552). The Codex mirror stays enforced by the separate
        # sync_codex_manifests --check --all gate; this does not duplicate it.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check_version_bump.py --base "$BASE_SHA" --head "$HEAD_SHA"

  loom-memory-store-integrity:
    name: loom memory store integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check loom-memory store integrity
        # Split out of `plugin version bump` (which it used to ride as a second
        # step) because a failure there reported a job name that describes a
        # DIFFERENT check — twice, a missing §Index line surfaced as
        # "plugin version bump failed" and cost a diagnosis round before anyone
        # looked at the store. A gate's job name is the first thing a reader
        # sees; it has to name what actually broke.
        #
        # Unlike its former host this job is not PR-gated: the store can drift
        # on a direct push to main too, and the check needs no PR context.
        #
        # The repository-local `check_loom_memory_integrity.py` this step used
        # to call was retired at 2026-09-10-okf-compatible-loom-memory (the
        # store is now the independent `loom-memory` plugin's OKF v0.2-
        # compatible profile, and its own validator ships inside the plugin) —
        # run that validator against the migrated store instead.
        run: |
          python3 loom-memory/scripts/loom_memory.py validate docs/loom/memory
