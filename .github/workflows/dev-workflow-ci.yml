name: dev-workflow CI

# Runs the dev-workflow plugin's shell test suite
# (dev-workflow/tests/test-*.sh), which previously ran in NO workflow —
# including the three memory-grep tests
# (test-memory-grep-match.sh / test-memory-grep-supersedes.sh /
# test-memory-grep-verify.sh) that pin memory-grep.sh's frozen exit-code
# contract. A regression there had no CI gate to catch it.
#
# Two jobs: the shell suite (glob over dev-workflow/tests/test-*.sh) and
# the cot-explain script pytest suite. The post-merge HEAD-body check
# (memory-grep.sh --verify-merged) lives in its own workflow file,
# memory-verify-merged.yml — it needs an unfiltered push-to-main trigger
# (a memory-worthy PR usually touches paths OTHER than dev-workflow/**),
# which this file's `paths:`-scoped triggers cannot provide without
# losing their scoping for this job. See that file's header for the
# full reasoning.
#
# Status: intended for `main` branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - 'dev-workflow/**'
      - '.github/workflows/dev-workflow-ci.yml'
  push:
    branches: [main]
    paths:
      - 'dev-workflow/**'
      - '.github/workflows/dev-workflow-ci.yml'

permissions:
  contents: read

jobs:
  shell-tests:
    name: dev-workflow shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run dev-workflow/tests shell suite
        run: |
          for t in dev-workflow/tests/test-*.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  # cot-explain ships two scripts whose contract is prose-heavy — a
  # leftover-markdown gate, a staleness stamp, a mermaid spec checker.
  # Their regression history lived in code comments until it was turned
  # into tests; a suite no workflow runs is the same dead letter the
  # comments were, so it gets a job here.
  cot-explain-pytest:
    name: cot-explain script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest markdown-it-py

      - name: Run cot-explain script tests
        run: python3 -m pytest dev-workflow/skills/cot-explain/scripts/ -v
