name: loom-siblings CI

# Runs the pytest suites of the loom-design stations that previously had
# NO CI coverage: the interface station (validators + skill/manifest
# behavioral tests), the principles station (validator + skill/manifest
# behavioral tests), and the discovery station (plugin manifest +
# marketplace entry + skill/manifest behavioral tests). loom-code and the
# spec station already have their own workflows (loom-code-ci.yml /
# loom-spec-ci.yml); this closes the remaining gap — the principles
# station's suite sat silently RED from #456 (2026-06-26) until #468's
# audit precisely because nothing ran it.
#
# The suites MUST run as separate pytest invocations: these station dirs
# ship same-basename test files (test_marketplace_entry.py /
# test_plugin_manifest.py, and since the 6->2 merge also
# test_knowledge_triage.py and test_mint_critic_verdict.py) with no
# __init__.py, so a single combined invocation dies with "import file
# mismatch" at collection. Separate jobs also give per-station CI
# visibility.
#
# Status: intended for `main` branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - 'loom-design/**'
      # Both plugins' test_marketplace_entry.py read the repo-root
      # marketplace.json, so an edit there must fire this gate too —
      # else a removed/renamed entry merges ungated (fail-open).
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/loom-siblings-ci.yml'
  push:
    branches: [main]
    paths:
      - 'loom-design/**'
      - '.claude-plugin/marketplace.json'

permissions:
  contents: read

jobs:
  interface-design:
    name: loom-design interface pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        # pytest = test runner. The validators are pure stdlib.
        run: python3 -m pip install --quiet pytest

      - name: Run loom-design scripts/interface pytest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest loom-design/scripts/interface/ -v

  product-principles:
    name: loom-design principles pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: python3 -m pip install --quiet pytest

      - name: Run loom-design scripts/principles pytest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest loom-design/scripts/principles/ -v

  discovery:
    name: loom-design discovery pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: python3 -m pip install --quiet pytest

      - name: Run loom-design scripts/discovery pytest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest loom-design/scripts/discovery/ -v
