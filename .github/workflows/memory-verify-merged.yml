name: memory verify-merged

# Post-merge carrier-check for a squash-shaped commit landing on `main`:
# fails the workflow when a memory-worthy squash (body has a `## Memory`
# heading) landed without a Decision:/Learning:/Gotcha: key surviving
# under it — the #574 silent-drop case.
#
# WHY THIS IS A SEPARATE FILE, not a second job in loom-workflow-ci.yml:
# loom-workflow-ci.yml's `on:` block scopes its pull_request/push triggers
# with `paths: loom-workflow/**` (+ its own workflow file), so unrelated
# pushes don't spend CI minutes re-running the loom-workflow shell-test
# suite. But a memory-worthy PR usually touches OTHER paths (that's the
# #574 case exactly), so gating this check behind the same path filter
# would silently skip it on precisely the pushes it exists to catch.
# GitHub Actions path filters gate at the `on:` (workflow-trigger) level,
# not per-job, so no job inside loom-workflow-ci.yml can ever see a push
# its path filter excluded. An unfiltered push-to-main trigger in its own
# file is the only way to run this check on every merge while leaving
# loom-workflow-ci.yml's path scoping intact for its own job.
#
# fetch-depth: 1 (the actions/checkout@v4 default) is sufficient — the
# script only inspects HEAD's own commit body (`git log -1 --format=%B
# HEAD`), never its ancestry.
#
# Status: intended for `main` branch protection.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-merged:
    name: memory verify-merged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify HEAD's memory carrier survived the squash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash loom-workflow/skills/git-memory/scripts/memory-grep.sh --verify-merged HEAD
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            # Wipe shape: the squash message lost its memory carrier. A red
            # workflow on main is not a notification (it fired unseen on #681)
            # — comment on the merged PR, then keep the red.
            title="$(git log -1 --format=%s HEAD)"
            if [[ "$title" =~ \(#([0-9]+)\)$ ]]; then
              pr="${BASH_REMATCH[1]}"
              gh pr comment "$pr" --body "**memory verify-merged: carrier loss detected.** The squash commit message for this PR lost its \`## Memory\` carrier (Decision:/Learning:/Gotcha: keys) — the web merge dialog likely cleared the message body. The PR body remains the surviving memory carrier; nothing is lost yet, but the git-side trailers did not land on \`main\`. Prescription for future merges: \`gh pr merge $pr --squash --body-file <file>\` from the CLI, which bypasses the dialog that wipes the body."
            else
              echo "verify-merged: exit 4, but HEAD's title has no trailing (#N) — skipping the PR comment." >&2
            fi
            exit 1
          fi
          exit "$rc"
