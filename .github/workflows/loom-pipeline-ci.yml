name: loom-design CI

# Runs the whole loom-design plugin pytest suite (loom-design/scripts/),
# covering every station directory — discovery, interface, pipeline,
# principles and spec — in ONE invocation. That includes the pipeline
# driver-build tests and the build-drift regression test that checks the
# generated driver stays in sync with its js segment sources.
#
# One job, one invocation: `loom-design/scripts/pytest.ini` sets
# `--import-mode=importlib`, so the repeated same-basename test files
# across stations (test_marketplace_entry.py, test_plugin_manifest.py,
# ...) no longer collide at collection; the same file's `pythonpath` line
# puts each station directory on `sys.path`, which importlib mode
# otherwise stops doing and the repo's bare sibling imports need. Before
# that root existed the stations needed a job each — this job replaces
# the four that loom-siblings-ci.yml and loom-spec-ci.yml used to run.
#
# The suite's build-drift test shells out to `node --check` on the
# generated driver segments, so this job needs Node available. It does
# not set up Node explicitly: ubuntu-latest ships a Node.js runtime by
# default (see actions/runner-images), and no other workflow in this
# repo runs its own actions/setup-node step for a similar `node --check`
# use, so we rely on the runner image's preinstalled Node here too.
#
# Status: intended for `main` branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - 'loom-design/**'
      # The pipeline plugin's hooks and loom-memory skill now live under
      # loom-code/, so edits there must fire this gate too.
      - 'loom-code/hooks/**'
      - 'loom-code/skills/loom-memory/**'
      # test_pipeline_marketplace_entry.py reads the repo-root
      # marketplace.json, so an edit there must fire this gate too —
      # else a removed/renamed entry merges ungated (fail-open).
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/loom-pipeline-ci.yml'
  push:
    branches: [main]
    paths:
      - 'loom-design/**'
      - 'loom-code/hooks/**'
      - 'loom-code/skills/loom-memory/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/loom-pipeline-ci.yml'

permissions:
  contents: read

jobs:
  pipeline:
    name: loom-design pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        # pytest = test runner; pyyaml = this suite's own CI-workflow
        # self-test parses YAML. Superset of what the collapsed
        # per-station jobs installed.
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Run the loom-design scripts pytest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest loom-design/scripts/ -q
