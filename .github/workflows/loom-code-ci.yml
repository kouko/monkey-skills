name: loom-code CI

# Runs loom-code's drift gates on every PR that touches the plugin (or
# the workflow itself), and on every push to main that changes the plugin.
#
# One SSOT drift gate is enforced:
#
#   - sync_codex_manifests.py: the Codex plugin manifest SSOT —
#                             each CODEX_ELIGIBLE plugin's .codex-plugin/plugin.json
#                             must stay in sync with its .claude-plugin/plugin.json.
#                             Any manual edit that diverges the two, or a missing
#                             eligible Codex manifest, fails the build. Repair
#                             locally with: python scripts/sync_codex_manifests.py --all
#
# The sync_codex_manifests.py pytest suite is also run so the generator logic
# itself is covered, mirroring legal-toolkit-ci.yml (pytest + drift).
#
# The living-spec, attack-catalogue and knowledge-SSOT steps were removed at
# loom-code 1.0 with the scripts they ran; the remaining shape is W3-04's.
#
# Status: intended for `main` branch protection.

on:
  pull_request:
    branches: [main]
    paths:
      - 'loom-code/**'
      - '.claude/hooks/**'
      - '.claude/settings.json'
      # The mechanism recompute reads docs/loom/evidence/mechanisms.yaml and
      # the doc-citation gate reads the docs/loom root docs + intent/, so a
      # docs/loom/** change must also trigger CI — else an unregistered
      # mechanism or a dangling citation could merge ungated.
      - 'docs/loom/**'
      # The Codex drift gate runs --all (every plugin's manifest pair), so the
      # trigger scope must match: ANY plugin's manifest edit must fire CI, else
      # a drift in a non-loom-code plugin merges ungated (fail-open).
      - '**/.claude-plugin/plugin.json'
      - '**/.codex-plugin/plugin.json'
      # Same rule for the pytest step: it runs the WHOLE `scripts/` dir, so the
      # trigger must be the whole dir too. Enumerating filenames here is what
      # already drifted once — scripts/check_version_bump.py was added with its
      # 9 tests and never listed, so a PR editing only that gate ran none of
      # them (fail-open on the gate's own maintenance).
      - 'scripts/**'
      # Repo-root drift guards scan the whole loom-*/ tree
      # (scripts/test_state_anchor_carrier_inventory.py's population is
      # EVERYTHING under loom-*/), the mechanism recompute counts every
      # plugin's skills/ directories, and the doc-citation gate reads
      # loom-design's and loom-workflow's prose — but only loom-code/** is
      # otherwise in this trigger, so a loom-design edit must fire this
      # workflow too, else it would merge ungated (fail-open).
      - 'loom-design/**'
      # Same, for the third plugin: its skills count toward the mechanism
      # recompute and its prose is in the doc-citation scope.
      - 'loom-workflow/**'
      # scripts/test_loom_design_ci_unified_root.py guards the single unified
      # loom-design pytest step in loom-design-ci.yml, but it is collected
      # only by THIS workflow's `scripts/` step -- so the whole workflow dir
      # must be a trigger. Naming just this file leaves the guard fail-open:
      # a PR editing only loom-design-ci.yml (or adding a brand-new
      # workflow with a per-station job) would never run it.
      - '.github/workflows/**'
      - '.github/workflows/loom-code-ci.yml'
  push:
    branches: [main]
    paths:
      - 'loom-code/**'
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - 'docs/loom/**'
      - '**/.claude-plugin/plugin.json'
      - '**/.codex-plugin/plugin.json'
      - 'scripts/**'
      # Same repo-root drift-guard rationale as the pull_request trigger above.
      - 'loom-design/**'
      - 'loom-workflow/**'
      # Same fail-open rationale as the pull_request trigger above.
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    name: pytest + knowledge-drift + codex-manifest-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The mechanism recompute takes `--baseline origin/main` and reads
          # that ref's tree, so the default depth-1 checkout would make the
          # baseline unresolvable and the step would die on a git error
          # rather than on a finding. A gate that dies before it checks is
          # the failure mode this depth exists against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        # pytest = test runner. The drift + sync scripts are pure stdlib (P1-E).
        # pyyaml = the contract manifest and mechanisms.yaml parser; test
        # modules fail at COLLECTION without it, which takes the whole suite
        # down rather than one test. markdown-it-py went with adjudication_render.
        # Dependency list see requirements-dev.txt.
        run: python3 -m pip install --quiet -r requirements-dev.txt

      - name: Run pytest suites (loom-code + codex-compat engine + hook)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m pytest loom-code/scripts/ scripts/ .claude/hooks/ -v -n auto

      - name: Verify standalone plugin filesystem boundaries
        run: |
          python3 scripts/check_plugin_boundaries.py loom-code
          python3 scripts/check_plugin_boundaries.py loom-design

      - name: Codex manifest drift gate (all plugins)
        # Each CODEX_ELIGIBLE plugin's .codex-plugin/plugin.json is generated
        # from its .claude-plugin/plugin.json. --check --all fails (exit 1) on
        # any drift OR any missing eligible manifest across all plugins, so a
        # manual edit can't diverge the two.
        run: python3 scripts/sync_codex_manifests.py --check --all

      - name: Recompute mechanism population
        # Recomputes the five admission-rule classes (concept-model §11,
        # spec REQ-7) against docs/loom/evidence/mechanisms.yaml: a class
        # member the recompute finds but the yaml does not register is red,
        # a registered member the recompute cannot find is red (a residual
        # entry inflates the baseline), a net-count rise without a
        # `budget-exception:` CHANGELOG line is red, and a mechanism with no
        # working `eval:` is red. Blocking since W3-04 — the transitional
        # continue-on-error came off with the old skill directories.
        run: python3 loom-code/scripts/check_mechanisms.py --baseline origin/main

      - name: Measure the loom surface
        # concept-model §11's measurement half: skill count, artifact-type
        # count, and the session-start injection word count. Only the last
        # one gates — exceeding the KICKOFF-DEFAULTS `session-start-baseline:`
        # word count exits 1 (REQ-8's halving is a hard condition, and a
        # station that quietly grows its session-start text is how it would
        # be lost). The two counts print for the record.
        run: python3 loom-code/scripts/check_mechanisms.py --measure

      - name: Check runtime prose contracts cite nothing repo-local
        # CLAUDE.md §Contract Citations: a runtime prose contract under the
        # loom skill/agent trees must not cite this repo's own development
        # records — the dispatched agent reads ITS repo, so such a citation
        # only resolves here. The script owns the full rule and its
        # shrinking DEBT_LIST.
        run: python3 loom-code/scripts/check_contract_citations.py

      - name: Check doc citations resolve
        # Every backtick `path:line` / `path` "anchor" citation in the
        # OPERATIVE loom prose (the three plugins' skills/agents/references/
        # contract trees, the docs/loom root docs, and docs/loom/intent/)
        # must resolve. Frozen stores are deliberately out of scope:
        # docs/loom/{plans,specs,backlog,design,archive}/ and
        # docs/loom/evidence/ are historical records whose line cites went
        # stale by design when the files they cite moved on.
        run: |
          set -euo pipefail
          git ls-files '*.md' \
            | grep -E '^(docs/loom/[^/]+\.md|docs/loom/intent/|loom-(code|design|workflow)/(skills|agents|references|contract)/)' \
            | xargs python3 loom-code/scripts/check_doc_citations.py

      - name: Verify skill cross-references resolve
        # Every relative markdown link in a SKILL.md must point at an existing
        # file. Guards the cross-skill reference convention (e.g. the shared
        # references/environment-gotchas.md pointers) against silent breakage.
        run: python3 loom-code/scripts/check-skill-crossrefs.py
