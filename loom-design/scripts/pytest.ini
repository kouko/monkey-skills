# Scoped to loom-design/scripts/ so ONE pytest invocation collects every
# station directory. importlib import mode stops pytest from requiring
# unique module basenames, which is what let the five stations keep
# same-named test modules (test_marketplace_entry.py, test_plugin_manifest.py).
# It also stops pytest inserting each test file's directory on sys.path,
# so every station directory carries a conftest.py that restores it --
# the repo's bare sibling imports depend on it.
[pytest]
addopts = --import-mode=importlib
