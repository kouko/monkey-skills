# Scoped to loom-design/scripts/ so ONE pytest invocation collects every
# station directory.
#
# `--import-mode=importlib` is what makes that single invocation possible:
# it drops pytest's requirement that every test module have a unique
# basename, so the stations can keep same-named modules side by side
# (test_marketplace_entry.py exists in both discovery/ and interface/).
#
# The cost is that importlib mode no longer inserts a test file's own
# directory on sys.path, which breaks the repo's bare sibling imports
# (`import heading_window` inside pipeline/). `pythonpath` puts each
# station directory back -- one enumerated line in place of five
# byte-identical conftest.py files.
[pytest]
addopts = --import-mode=importlib
pythonpath = discovery interface pipeline principles spec
