# Scoped to loom-design/scripts/ so ONE pytest invocation collects every
# station directory.
#
# `--import-mode=importlib` is what makes that single invocation possible:
# it drops pytest's requirement that every test module have a unique
# basename, so the stations can keep same-named modules side by side.
#
# The cost is that importlib mode no longer inserts a test file's own
# directory on sys.path, which breaks bare sibling imports. `pythonpath`
# puts the station directories back -- one enumerated line in place of one
# byte-identical conftest.py per station.
#
# HAZARD -- this is ONE shared sys.path, not per-station resolution. Test
# modules keep their own identity under importlib mode, but a NON-test module
# whose basename exists in two stations would be resolved once, for
# everybody, from whichever station comes FIRST on this line. As of loom 1.0
# no basename is duplicated (`mint_critic_verdict.py`, the SSOT/functional-
# copy pair that used to be, went with the critic skills), so the order below
# is not load-bearing today -- but it becomes load-bearing the moment a
# collision is added, which is why test_unified_pytest_root.py pins both the
# station list and the (currently empty) set of shadowed basenames.
[pytest]
addopts = --import-mode=importlib
pythonpath = interface principles spec
