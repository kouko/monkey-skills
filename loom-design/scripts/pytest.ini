# Scoped to loom-design/scripts/ so ONE pytest invocation collects every
# station directory.
#
# `--import-mode=importlib` is what makes that single invocation possible:
# it drops pytest's requirement that every test module have a unique
# basename, so the stations can keep same-named modules side by side
# (test_marketplace_entry.py exists in both discovery/ and interface/).
#
# The cost is that importlib mode no longer inserts a test file's own
# directory on sys.path, which breaks the repo's bare sibling imports
# (`import heading_window` inside pipeline/). `pythonpath` puts the station
# directories back -- one enumerated line in place of five byte-identical
# conftest.py files.
#
# HAZARD -- this is ONE shared sys.path, not per-station resolution. Test
# modules keep their own identity under importlib mode, but a NON-test module
# whose basename exists in two stations is resolved once, for everybody, from
# whichever station comes FIRST on this line. `mint_critic_verdict.py` exists
# in both interface/ and spec/, and `interface` preceding `spec` below is the
# only reason a bare `from mint_critic_verdict import ...` binds the
# interface copy -- in the spec/ tests too. So the order of this line is a
# load-bearing invariant that merely looks alphabetical: reordering it, or
# adding a station that sorts before `interface`, silently swaps which copy
# every test exercises, and no existing test would notice (the lockstep guard
# compares the two files by path, and they are ast-identical). Changing this
# order is a behavioural change. test_unified_pytest_root.py pins both the
# station list and the set of shadowed basenames.
[pytest]
addopts = --import-mode=importlib
pythonpath = discovery interface pipeline principles spec
